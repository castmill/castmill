<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Castmill Legacy Adapter</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #legacy-boot {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #legacy-boot div {
        width: 20em;
        max-width: 80vw;
        height: 0.375em;
        background: #222;
      }
      #legacy-boot div::after {
        content: '';
        display: block;
        width: 35%;
        height: 100%;
        background: #4a7cff;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="legacy-boot"><div></div></div>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
