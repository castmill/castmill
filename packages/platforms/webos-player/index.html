<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <link rel="shortcut icon" type="image/ico" href="/src/assets/favicon.ico" />
    <title>Castmill</title>
    <style>
      html,
      body {
        margin: 0;
        background: #000;
      }
      #webos-boot {
        position: fixed;
        top: 0;
        right: 0;
        bottom: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #webos-boot div {
        width: 20em;
        max-width: 80vw;
        height: 0.375em;
        background: #222;
      }
      #webos-boot div::after {
        content: '';
        display: block;
        width: 35%;
        height: 100%;
        background: #4a7cff;
      }
    </style>

    <script
      type="text/javascript"
      src="lib/scap_1.7/cordova/2.7.0/cordova.webos.js"
    ></script>
    <script type="text/javascript" src="lib/custom.js"></script>
    <script type="text/javascript" src="lib/scap-loader.js"></script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="webos-boot"><div></div></div>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
