    <title>Castmill Dashboard</title>

    <!-- Apply the saved light/dark theme before first paint (see src/theme). -->
    <script>
      (function () {
        var theme = 'dark';
        try {
          var stored = localStorage.getItem('castmill_theme');
          if (stored === 'light' || stored === 'dark') {
            theme = stored;
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            theme = 'light';
          }
        } catch (e) {}
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
