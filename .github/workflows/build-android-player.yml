name: Build Android player

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android-player.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'packages/cache/**'
      - 'packages/device/**'
      - 'packages/player/**'
      - 'packages/platforms/android-player/**'
  pull_request:
    branches: [main, next]
    paths:
      - '.github/workflows/build-android-player.yml'
      - 'package.json'
      - 'yarn.lock'
      - 'packages/cache/**'
      - 'packages/device/**'
      - 'packages/player/**'
      - 'packages/platforms/android-player/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Use Node.js current
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'yarn'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Install workspace dependencies
        run: yarn install --ignore-engines --frozen-lockfile --non-interactive

      - name: Build Android player dependencies
        run: |
          yarn workspace @castmill/cache build
          yarn workspace @castmill/player build
          yarn workspace @castmill/device build

      - name: Build debug APK
        run: yarn workspace @castmill/android-player android:build

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: android-player-debug-apk
          path: packages/platforms/android-player/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
